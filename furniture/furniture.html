<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Furniture Quotes | Hodge Industries</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#221f1b">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#161512;
    --paper:#f6f3ee;
    --paper-dim:#efeae1;
    --charcoal:#221f1b;
    --charcoal-2:#2c2822;
    --brass:#a9793f;
    --brass-light:#c99a5f;
    --line:rgba(22,21,18,0.12);
    --line-dark:rgba(246,243,238,0.14);
    --max:1100px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--charcoal);color:var(--paper);
    font-size:14px;line-height:1.5;min-height:100vh;
  }

  /* ── Nav (matches index.html exactly) ── */
  header{
    position:sticky;top:0;z-index:100;
    background:var(--charcoal);border-bottom:1px solid var(--line-dark);
  }
  nav.wrap{
    max-width:var(--max);margin:0 auto;padding:0 32px;
    display:flex;align-items:center;justify-content:space-between;
    height:60px;gap:32px;
  }
  .brand{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:19px;font-weight:600;color:var(--paper);
    text-decoration:none;line-height:1.15;flex-shrink:0;
  }
  .brand span{display:block;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--brass);font-weight:600;margin-top:3px;font-family:'Inter',sans-serif;}
  .nav-links{display:flex;gap:36px;align-items:center;}
  .nav-links a{font-size:13.5px;color:var(--paper);text-decoration:none;opacity:0.75;font-weight:500;transition:opacity 0.2s;}
  .nav-links a:hover,.nav-links a.active{opacity:1;color:var(--brass-light);}
  .btn{
    background:var(--charcoal);color:var(--paper)!important;
    font-weight:600;border:1px solid var(--charcoal);
    padding:9px 20px;font-size:13px;border-radius:4px;
    text-decoration:none;display:inline-block;transition:all 0.2s;font-family:'Inter',sans-serif;
  }
  .btn:hover{background:transparent;color:var(--charcoal)!important;}
  .btn-outline{background:transparent;color:var(--paper)!important;border-color:rgba(246,243,238,0.45);}
  .btn-outline:hover{background:var(--paper);color:var(--charcoal)!important;}
  .btn-brass{background:var(--brass);color:var(--paper)!important;border-color:var(--brass);}
  .btn-brass:hover{background:var(--brass-light);border-color:var(--brass-light);}
  .nav-cta{display:none;}
  @media(min-width:860px){.nav-cta{display:inline-block;}}
  .menu-toggle{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--paper);}
  @media(max-width:860px){
    .nav-links{display:none;position:absolute;top:60px;left:0;right:0;background:var(--charcoal);flex-direction:column;padding:20px 32px;gap:18px;border-bottom:1px solid var(--line-dark);}
    .nav-links.open{display:flex;}
    .menu-toggle{display:block;}
  }

  /* ── Page layout ── */
  .page-wrap{max-width:var(--max);margin:0 auto;padding:48px 32px 80px;}

  .page-eyebrow{
    font-size:11px;letter-spacing:0.18em;text-transform:uppercase;
    color:var(--brass);font-weight:600;margin-bottom:10px;
    display:flex;align-items:center;gap:10px;
  }
  .page-eyebrow::before{content:"";width:28px;height:1px;background:var(--brass);}
  .page-title{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:clamp(32px,5vw,52px);font-weight:500;
    color:var(--paper);line-height:1.08;margin-bottom:14px;
  }
  .page-sub{font-size:15px;color:rgba(246,243,238,0.55);line-height:1.7;max-width:56ch;margin-bottom:40px;}

  /* ── States ── */
  .state-box{
    background:rgba(169,121,63,0.1);border:1px solid rgba(169,121,63,0.3);
    border-radius:8px;padding:16px 20px;margin-bottom:28px;
    font-size:13.5px;color:rgba(246,243,238,0.75);line-height:1.65;
  }
  .state-box.submitted{background:rgba(169,121,63,0.08);}
  .badge{
    display:inline-block;padding:4px 14px;border-radius:20px;font-size:11px;
    letter-spacing:0.1em;text-transform:uppercase;font-weight:600;
    background:rgba(169,121,63,0.2);color:var(--brass-light);border:1px solid rgba(169,121,63,0.35);
  }

  /* ── Item cards ── */
  .items-list{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
  .item-card{
    background:rgba(246,243,238,0.04);border:1px solid var(--line-dark);
    border-radius:8px;padding:22px 24px;
  }
  .item-card-header{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;
  }
  .item-num{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--brass);font-weight:600;}
  .remove-btn{
    background:none;border:none;color:rgba(246,243,238,0.25);
    cursor:pointer;font-size:20px;line-height:1;padding:0 4px;transition:color 0.2s;
  }
  .remove-btn:hover{color:rgba(246,243,238,0.7);}

  .field-grid{display:grid;gap:14px;}
  .fg-4{grid-template-columns:2fr 3fr 80px 1fr;}
  .fg-1{grid-template-columns:1fr;}
  @media(max-width:700px){.fg-4{grid-template-columns:1fr 1fr;}.fg-4 .span-2{grid-column:1/-1;}}

  .field label{
    display:block;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;
    color:rgba(246,243,238,0.4);margin-bottom:5px;font-weight:500;
  }
  .field label .req{color:var(--brass);}
  .field input,.field select,.field textarea{
    width:100%;background:rgba(22,21,18,0.6);
    border:1px solid var(--line-dark);border-radius:5px;
    color:var(--paper);font-size:13.5px;padding:9px 12px;
    outline:none;font-family:'Inter',sans-serif;
    transition:border-color 0.2s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brass);}
  .field textarea{resize:vertical;min-height:56px;}
  .field select option{background:var(--charcoal-2);}

  /* Admin pricing strip */
  .admin-strip{
    margin-top:16px;padding-top:16px;
    border-top:1px solid var(--line-dark);
  }
  .admin-label{
    font-size:10px;letter-spacing:0.18em;text-transform:uppercase;
    color:var(--brass);margin-bottom:12px;font-weight:600;
  }
  .admin-grid{display:grid;grid-template-columns:130px 200px 1fr auto;gap:12px;align-items:end;}
  @media(max-width:700px){.admin-grid{grid-template-columns:1fr 1fr;}}
  .line-total{text-align:right;}
  .line-total-label{font-size:11px;color:rgba(246,243,238,0.35);margin-bottom:3px;}
  .line-total-val{
    font-family:'Cormorant Garamond',serif;font-size:22px;
    color:var(--brass-light);font-weight:600;
  }

  /* ── Add item button ── */
  .add-btn{
    width:100%;padding:16px;background:rgba(169,121,63,0.08);
    border:1px dashed rgba(169,121,63,0.5);border-radius:8px;
    color:var(--brass-light);font-size:14px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;transition:all 0.2s;margin-bottom:32px;
    letter-spacing:0.02em;
  }
  .add-btn:hover{background:rgba(169,121,63,0.16);border-color:var(--brass-light);}

  /* ── Totals ── */
  .totals-card{
    background:rgba(169,121,63,0.08);border:1px solid rgba(169,121,63,0.25);
    border-radius:8px;padding:22px 24px;margin-bottom:28px;
  }
  .totals-row{display:flex;justify-content:space-between;align-items:center;}
  .totals-row+.totals-row{margin-top:10px;padding-top:10px;border-top:1px solid rgba(169,121,63,0.15);}
  .totals-row span:first-child{font-size:13px;color:rgba(246,243,238,0.5);}
  .totals-main{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--brass-light);font-weight:600;}
  .totals-sub{font-family:'Cormorant Garamond',serif;font-size:20px;color:rgba(246,243,238,0.65);}
  .totals-note{font-size:11.5px;color:rgba(246,243,238,0.3);margin-top:8px;}

  /* ── Actions ── */
  .actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;}

  .success-screen{
    max-width:600px;margin:48px auto;padding:0 24px;
  }
  .success-banner{
    background:rgba(169,121,63,0.15);
    border:2px solid var(--brass);
    border-radius:12px;
    padding:40px 40px 36px;
    text-align:center;
    margin-bottom:32px;
  }
  .success-icon{
    width:72px;height:72px;border-radius:50%;
    background:var(--brass);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 24px;font-size:32px;color:var(--charcoal);
    font-weight:700;
  }
  .success-screen h2{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:500;margin-bottom:14px;color:var(--paper);}
  .success-screen p{color:rgba(246,243,238,0.65);line-height:1.8;font-size:15px;margin-bottom:28px;}
  .btn-back{
    display:inline-block;padding:14px 36px;
    background:var(--brass);color:var(--paper)!important;
    border:2px solid var(--brass);border-radius:6px;
    font-size:14px;font-weight:700;letter-spacing:0.04em;
    text-decoration:none;cursor:pointer;font-family:'Inter',sans-serif;
    transition:all 0.2s;
  }
  .btn-back:hover{background:var(--brass-light);border-color:var(--brass-light);}

  /* ── Admin list ── */
  .order-cards{display:flex;flex-direction:column;gap:12px;}
  .order-card{
    background:rgba(246,243,238,0.04);border:1px solid var(--line-dark);
    border-radius:8px;padding:20px 24px;cursor:pointer;transition:border-color 0.2s;
    display:flex;justify-content:space-between;align-items:center;
  }
  .order-card:hover{border-color:var(--brass);}
  .order-card-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;margin-bottom:4px;}
  .order-card-meta{font-size:12.5px;color:rgba(246,243,238,0.4);}
  .order-card-total{text-align:right;}
  .order-card-total .amt{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--brass-light);font-weight:600;}
  .order-card-total .lbl{font-size:11px;color:rgba(246,243,238,0.3);margin-top:2px;}

  /* ── No-ID landing ── */
  .landing{max-width:480px;margin:100px auto;text-align:center;padding:0 24px;}
  .landing p{color:rgba(246,243,238,0.5);line-height:1.75;font-size:15px;}

  /* ── Save status indicator ── */
  #saveStatus{
    position:fixed;bottom:24px;right:24px;
    display:flex;align-items:center;gap:8px;
    background:var(--charcoal-2);border:1px solid var(--line-dark);
    border-radius:20px;padding:8px 16px;
    font-size:12px;color:rgba(246,243,238,0.5);
    opacity:0;transition:opacity 0.3s ease;
    z-index:300;pointer-events:none;
  }
  #saveStatus.visible{opacity:1;}
  #saveStatus.saving{color:rgba(246,243,238,0.5);}
  #saveStatus.saved{color:var(--brass-light);border-color:rgba(169,121,63,0.3);}
  #saveStatus.error{color:#e07070;border-color:rgba(224,112,112,0.3);}
  .status-dot{
    width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;
  }
  #saveStatus.saving .status-dot{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:0.3;}50%{opacity:1;}}
  @media(max-width:860px){#saveStatus{bottom:80px;}}
  footer{background:var(--charcoal);border-top:1px solid var(--line-dark);}
  footer .wrap{max-width:var(--max);margin:0 auto;padding:28px 32px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;}
  footer p{font-size:12.5px;color:rgba(246,243,238,0.5);}
  .foot-links{display:flex;gap:24px;}
  .foot-links a{font-size:12.5px;color:rgba(246,243,238,0.5);text-decoration:none;transition:color 0.2s;}
  .foot-links a:hover{color:var(--paper);}

  /* ── Mobile CTA bar ── */
  .mobile-cta-bar{
    display:none;position:fixed;bottom:0;left:0;right:0;
    background:var(--charcoal);border-top:1px solid var(--line-dark);
    padding:12px 24px;z-index:200;gap:12px;
  }
  @media(max-width:860px){.mobile-cta-bar{display:flex;}}
  .mobile-cta-bar a{flex:1;text-align:center;padding:11px;border-radius:4px;font-size:14px;font-weight:600;text-decoration:none;}
  .mobile-cta-bar .call{background:var(--brass);color:var(--paper);}
  .mobile-cta-bar .email{background:transparent;border:1px solid rgba(246,243,238,0.35);color:var(--paper);}
  @media(max-width:860px){.page-wrap{padding-bottom:100px;}}
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a href="/" class="brand">Hodge Industries<span>AV, Smart Home &amp; Doors</span></a>
    <div class="nav-links" id="navLinks">
      <a href="/#services">Services</a>
      <a href="/#approach">Approach</a>
      <a href="/#process">Process</a>
      <a href="/#work">Our Work</a>
      <a href="/#about">About</a>
      <a href="/#contact">Contact</a>
      <a href="/furniture/" class="active">Furniture Quotes</a>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <a href="/#contact" class="btn nav-cta">Start a Project</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">&#9776;</button>
    </div>
  </nav>
</header>

<!-- Hidden Netlify form — required for Netlify to detect and process submissions -->
<form name="furniture-order" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="furniture-order">
  <input name="client">
  <input name="order-url">
  <input name="item-count">
  <textarea name="items"></textarea>
</form>

<div id="app" class="page-wrap">
  <!-- Rendered by JS below -->
  <div style="text-align:center;padding:80px 0;color:rgba(246,243,238,0.3);">Loading…</div>
</div>

<footer>
  <div class="wrap">
    <p>&copy; <span id="year"></span> Hodge Industries. Serving Charlotte, NC and the surrounding region.</p>
    <div class="foot-links">
      <a href="/#services">Services</a>
      <a href="/#about">About</a>
      <a href="/#contact">Contact</a>
      <a href="https://www.instagram.com/hodge_ind/" target="_blank" rel="noopener">Instagram</a>
      <a href="/privacy-policy.html">Privacy</a>
    </div>
  </div>
</footer>

<div id="saveStatus"><span class="status-dot"></span><span id="saveStatusText">Saving…</span></div>

<div class="mobile-cta-bar" id="mobileCta">
  <a href="tel:+17046298677" class="call">Call</a>
  <a href="mailto:me@robbiehodge.com" class="email">Email</a>
</div>

<script>
/* ─── Config ─────────────────────────────────────────────────── */
const YOUR_EMAIL  = 'me@robbiehodge.com';
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxTfwRJwcXjaEqsCqNCWHohUVVGAb8D1P6kku08EpbiZHmzaYrmpnxWneGtawr2YTlt/exec';
const TYPE_OPTIONS   = ['Seating','Tables','Covers','Lighting','Decor','Storage','Other'];
const STATUS_OPTIONS = ['Pending','Quoting','Quoted','In Stock','Temporarily Unavailable','Sold Out','Re-purchase Needed'];

/* ─── Misc helpers ───────────────────────────────────────────── */
document.getElementById('year').textContent = new Date().getFullYear();
document.getElementById('menuToggle').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('open');
});

function fmt(n) {
  const num = parseFloat(n);
  return isNaN(num) ? '—' : '$' + num.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function lineTotal(it) { return (parseFloat(it.priceEach)||0) * (parseInt(it.qty)||0); }
function orderTotal(items) { return items.reduce((s,it) => s + lineTotal(it), 0); }
function newItem() {
  return { id: Math.random().toString(36).slice(2), name:'', url:'', qty:1, type:'', notes:'', priceEach:'', stock:'', status:'Pending' };
}
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ─── URL params ─────────────────────────────────────────────── */
const params    = new URLSearchParams(location.search);
const CLIENT_ID = (params.get('id') || '').toLowerCase().trim();
const IS_ADMIN  = params.get('admin') === '1';

/* ─── Google Sheets API ──────────────────────────────────────── */
async function api(payload) {
  try {
    const url = new URL(BACKEND_URL);
    url.searchParams.set('action', payload.action);
    if (payload.clientId) url.searchParams.set('clientId', payload.clientId);

    if (payload.action === 'load' || payload.action === 'listClients') {
      const r = await fetch(url.toString());
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } else {
      await fetch(url.toString(), {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload),
      });
      return { ok: true };
    }
  } catch(e) {
    console.error('API error', e);
    return { ok: false, error: e.message };
  }
}

async function loadOrder(id) {
  const r = await api({ action:'load', clientId: id });
  if (!r.ok) return null;
  return { items: r.items || [], submitted: r.submitted || false, contact: r.contact || {} };
}
async function saveOrder(id, data) {
  return api({ action:'save', clientId: id, items: data.items, submitted: data.submitted, contact: data.contact || {} });
}
async function listClients() {
  const r = await api({ action:'listClients' });
  return r.ok ? (r.clients || []) : [];
}

/* ─── Render helpers ─────────────────────────────────────────── */
function fieldHTML(label, inputHTML, req) {
  return `<div class="field"><label>${label}${req ? '<span class="req"> *</span>' : ''}</label>${inputHTML}</div>`;
}
function inp(name, val, placeholder, type) {
  return `<input type="${type||'text'}" name="${name}" value="${esc(val||'')}" placeholder="${esc(placeholder||'')}">`;
}
function sel(name, val, options) {
  const opts = options.map(o => `<option${o===val?' selected':''}>${esc(o)}</option>`).join('');
  return `<select name="${name}"><option value="">— select —</option>${opts}</select>`;
}

/* ─── Contact block HTML ─────────────────────────────────────── */
function contactBlockHTML(contact) {
  return `
  <div class="item-card" id="contactBlock" style="margin-bottom:20px;border-color:rgba(169,121,63,0.3);">
    <div class="item-card-header" style="margin-bottom:14px;">
      <span class="item-num">Your Info</span>
    </div>
    <div class="field-grid" style="grid-template-columns:1fr 1fr 1fr;gap:14px;">
      ${fieldHTML('Full Name', inp('contact-name', contact.name, 'Jane Smith'), false)}
      ${fieldHTML('Email', inp('contact-email', contact.email, 'jane@email.com', 'email'), false)}
      ${fieldHTML('Phone', inp('contact-phone', contact.phone, '(704) 555-0100', 'tel'), false)}
    </div>
  </div>`;
}

function collectContact() {
  return {
    name:  (document.querySelector('[name="contact-name"]')  || {}).value || '',
    email: (document.querySelector('[name="contact-email"]') || {}).value || '',
    phone: (document.querySelector('[name="contact-phone"]') || {}).value || '',
  };
}

/* ─── Item card ──────────────────────────────────────────────── */
function itemCardHTML(item, idx, isAdmin) {
  const lt = lineTotal(item);
  const urlDomain = (() => { try { return item.url ? new URL(item.url).hostname.replace('www.','') : ''; } catch { return ''; } })();
  return `
  <div class="item-card" data-id="${item.id}">
    <div class="item-card-header">
      <span class="item-num">Item ${idx+1}</span>
      <button class="remove-btn" data-remove="${item.id}" title="Remove item">×</button>
    </div>
    <div class="field-grid fg-4">
      ${fieldHTML('Item Name', inp('name', item.name, 'e.g. Belvedere Lounge Chair'), true)}
      <div class="field span-2">
        <label>Reference URL</label>
        <input type="url" name="url" value="${esc(item.url||'')}" placeholder="Paste product link">
        ${urlDomain ? `<div style="margin-top:5px;"><a href="${esc(item.url)}" target="_blank" rel="noopener" style="font-size:11px;color:var(--brass-light);text-decoration:none;">↗ ${esc(urlDomain)}</a></div>` : ''}
      </div>
      <div class="field">
        <label>Qty <span class="req">*</span></label>
        <input type="number" name="qty" min="1" max="999" value="${Math.max(1,parseInt(item.qty)||1)}">
      </div>
      ${fieldHTML('Type', sel('type', item.type, TYPE_OPTIONS))}
    </div>
    <div class="field-grid fg-1" style="margin-top:12px;">
      ${fieldHTML('Notes / Specs', `<textarea name="notes" placeholder="Color, finish, fabric, dimensions, anything specific…">${esc(item.notes)}</textarea>`)}
    </div>
    ${isAdmin ? `
    <div class="admin-strip">
      <div class="admin-label">Pricing — your eyes only</div>
      <div class="admin-grid">
        ${fieldHTML('Price Each ($)', `<input type="number" name="priceEach" step="0.01" min="0" value="${esc(item.priceEach)}" placeholder="0.00">`)}
        ${fieldHTML('Status', `<select name="status">${STATUS_OPTIONS.map(o=>`<option${o===item.status?' selected':''}>${esc(o)}</option>`).join('')}</select>`)}
        ${fieldHTML('Internal Note', inp('stock', item.stock, 'Stock, supplier, lead time…'))}
        <div class="line-total">
          <div class="line-total-label">Line Total</div>
          <div class="line-total-val">${lt > 0 ? fmt(lt) : '—'}</div>
        </div>
      </div>
    </div>` : ''}
  </div>`;
}

/* ─── Collect items from DOM ─────────────────────────────────── */
function collectItems() {
  return [...document.querySelectorAll('.item-card[data-id]')].map(card => {
    const get = n => (card.querySelector(`[name="${n}"]`) || {}).value || '';
    return {
      id: card.dataset.id,
      name: get('name'), url: get('url'),
      qty: Math.max(1, parseInt(get('qty')) || 1),
      type: get('type'), notes: get('notes'),
      priceEach: get('priceEach'), stock: get('stock'),
      status: get('status') || 'Pending'
    };
  });
}

/* ─── Validation ─────────────────────────────────────────────── */
function validateItems(items) {
  const errors = [];
  items.forEach((it, i) => {
    if (!it.name.trim()) errors.push(`Item ${i+1}: item name is required.`);
    if (parseInt(it.qty) < 1 || isNaN(parseInt(it.qty))) errors.push(`Item ${i+1}: quantity must be at least 1.`);
  });
  return errors;
}

/* ─── Save status indicator ──────────────────────────────────── */
const statusEl   = document.getElementById('saveStatus');
const statusText = document.getElementById('saveStatusText');
let hideTimer;

function showStatus(state, text) {
  statusEl.className = 'visible ' + state;
  statusText.textContent = text;
  clearTimeout(hideTimer);
  if (state === 'saved') {
    hideTimer = setTimeout(() => { statusEl.className = ''; }, 3000);
  }
}

/* ─── Debounced auto-save ────────────────────────────────────── */
let _debounce;
function scheduleSave(id, getData) {
  clearTimeout(_debounce);
  showStatus('saving', 'Saving…');
  _debounce = setTimeout(async () => {
    const data = getData();
    const r = await saveOrder(id, data);
    if (r && r.ok === false) {
      showStatus('error', 'Save failed — retrying…');
      setTimeout(() => scheduleSave(id, getData), 3000);
    } else {
      showStatus('saved', 'Saved ✓');
    }
  }, 1500);
}

/* ─── Spinner / error ────────────────────────────────────────── */
function showSpinner(msg) {
  document.getElementById('app').innerHTML = `
    <div style="text-align:center;padding:80px 0;">
      <div style="width:36px;height:36px;border:2px solid var(--brass);border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 20px;"></div>
      <p style="color:rgba(246,243,238,0.4);font-size:14px;">${msg||'Loading…'}</p>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
}

function showError(msg, retryFn) {
  document.getElementById('app').innerHTML = `
    <div style="max-width:480px;margin:80px auto;text-align:center;padding:0 24px;">
      <div style="font-size:36px;margin-bottom:16px;">⚠️</div>
      <h2 style="font-family:'Cormorant Garamond',serif;font-size:28px;margin-bottom:12px;">Something went wrong</h2>
      <p style="color:rgba(246,243,238,0.5);margin-bottom:28px;line-height:1.7;">${msg}</p>
      ${retryFn ? '<button class="btn btn-brass" id="retryBtn">Try Again</button>' : ''}
    </div>`;
  if (retryFn) document.getElementById('retryBtn').addEventListener('click', retryFn);
}

/* ─── CLIENT VIEW ────────────────────────────────────────────── */
async function renderClient() {
  const id    = CLIENT_ID;
  const name  = cap(id);
  // Read email from URL param (set on first visit from landing page)
  const emailParam = decodeURIComponent(params.get('email') || '');

  showSpinner('Loading your quote…');

  let data;
  try { data = await loadOrder(id); }
  catch(e) {
    showError("We couldn't load your quote. Check your connection and try again.", renderClient);
    return;
  }
  if (!data) {
    showError("We couldn't connect to the server. Please try refreshing the page.", renderClient);
    return;
  }

  const wasSubmitted = data.submitted;
  let submitted = false;
  let isDirty   = false;

  let items = (wasSubmitted || !data.items || !data.items.length)
    ? [newItem()]
    : data.items;

  // Pre-fill email from URL param on first visit; otherwise use saved contact
  let contact = data.contact && data.contact.email
    ? data.contact
    : { ...( data.contact || {} ), email: emailParam };

  // Canonical URL without the ?email= param (clean bookmark URL)
  const cleanUrl = location.origin + location.pathname + '?id=' + id;

  function getData() {
    return { items: collectItems(), submitted, contact: collectContact() };
  }

  function scheduleClientSave() {
    if (!isDirty) return;
    scheduleSave(id, getData);
  }

  function render() {
    const gt = orderTotal(items.filter(it => it.priceEach));
    document.getElementById('app').innerHTML = `

      <!-- URL bookmark banner -->
      <div style="background:rgba(169,121,63,0.08);border:1px solid rgba(169,121,63,0.25);border-radius:8px;
                  padding:14px 18px;margin-bottom:32px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--brass);font-weight:600;margin-bottom:4px;">Your Personal Quote Link</div>
          <div style="font-size:13px;color:rgba(246,243,238,0.6);word-break:break-all;">${esc(cleanUrl)}</div>
        </div>
        <button id="bannerCopyBtn" class="btn btn-outline" style="font-size:12px;padding:8px 16px;flex-shrink:0;">Copy &amp; Bookmark</button>
      </div>

      <div class="page-eyebrow">Quote Request</div>
      <h1 class="page-title" style="margin-bottom:14px;">${name}'s Quote</h1>
      <p class="page-sub">Add the items you'd like sourced below. Paste a reference link, add quantity and any specs. Your list <strong>saves automatically</strong> as you type — come back anytime from any device using the link above. Hit <strong>Submit for Quote</strong> when you're done.</p>

      ${contactBlockHTML(contact)}

      <div class="items-list" id="itemsList">
        ${items.map((it,i) => itemCardHTML(it, i, false)).join('')}
      </div>

      <button class="add-btn" id="addBtn">＋ Add Another Item</button>

      ${gt > 0 ? `
      <div class="totals-card">
        <div class="totals-row">
          <span>Subtotal (quoted items)</span>
          <span class="totals-main">${fmt(gt)}</span>
        </div>
        <div class="totals-row">
          <span>50% Deposit</span>
          <span class="totals-sub">${fmt(gt * 0.5)}</span>
        </div>
        <div class="totals-note">Shipping not included. Deposit required before order is placed.</div>
      </div>` : ''}

      <div class="actions">
        <button class="btn btn-outline" id="saveBtn">Save Draft</button>
        <button class="btn btn-brass" id="submitBtn">Submit for Quote →</button>
      </div>`;
    attachClientEvents();
  }

  function attachClientEvents() {
    // Banner copy button
    document.getElementById('bannerCopyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(cleanUrl).then(() => {
        const b = document.getElementById('bannerCopyBtn');
        b.textContent = 'Copied ✓';
        setTimeout(() => { b.textContent = 'Copy & Bookmark'; }, 2000);
      }).catch(() => { prompt('Copy your quote link:', cleanUrl); });
    });

    // Mark dirty and schedule save on any change
    const markAndSave = () => { isDirty = true; scheduleClientSave(); };
    document.getElementById('contactBlock').addEventListener('input', markAndSave);
    document.getElementById('itemsList').addEventListener('input',  markAndSave);
    document.getElementById('itemsList').addEventListener('change', markAndSave);

    // Remove item — confirm first
    document.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', () => {
        const nameEl = btn.closest('.item-card').querySelector('[name="name"]');
        const label  = nameEl && nameEl.value.trim() ? `"${nameEl.value.trim()}"` : 'this item';
        if (!confirm(`Remove ${label}?`)) return;
        items = collectItems().filter(it => it.id !== btn.dataset.remove);
        if (!items.length) items = [newItem()];
        render();
        isDirty = true;
        scheduleClientSave();
      });
    });

    // Add item
    document.getElementById('addBtn').addEventListener('click', () => {
      items = collectItems();
      items.push(newItem());
      render();
      isDirty = true;
      scheduleClientSave();
      requestAnimationFrame(() => {
        const last = document.querySelector('.item-card[data-id]:last-of-type');
        if (last) last.scrollIntoView({ behavior:'smooth', block:'start' });
      });
    });

    // Manual save draft
    document.getElementById('saveBtn').addEventListener('click', async () => {
      clearTimeout(_debounce);
      const btn = document.getElementById('saveBtn');
      btn.textContent = 'Saving…'; btn.disabled = true;
      showStatus('saving', 'Saving…');
      isDirty = true;
      await saveOrder(id, getData());
      showStatus('saved', 'Saved ✓');
      btn.textContent = 'Saved ✓';
      setTimeout(() => { btn.textContent = 'Save Draft'; btn.disabled = false; }, 2000);
    });

    // Submit for quote
    document.getElementById('submitBtn').addEventListener('click', async () => {
      items = collectItems();
      contact = collectContact();
      const errors = validateItems(items);
      if (errors.length) { alert(errors.join('\n')); return; }

      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Submitting…'; btn.disabled = true;
      document.getElementById('saveBtn').disabled = true;

      clearTimeout(_debounce);
      showStatus('saving', 'Saving…');
      await saveOrder(id, { items, submitted: true, contact });
      showStatus('saved', 'Saved ✓');
      submitted = true;
      isDirty = false; // reset so returning doesn't re-save blank

      // Netlify Forms notification — rich detail
      const summary = items.map((it,i) => [
        `Item ${i+1}: ${it.name}`,
        `  Qty: ${it.qty}`,
        it.type  ? `  Type: ${it.type}`   : '',
        it.url   ? `  URL: ${it.url}`     : '',
        it.notes ? `  Notes: ${it.notes}` : '',
      ].filter(Boolean).join('\n')).join('\n\n');

      const contactLine = [
        contact.name  ? `Name: ${contact.name}`   : '',
        contact.email ? `Email: ${contact.email}` : '',
        contact.phone ? `Phone: ${contact.phone}` : '',
      ].filter(Boolean).join(' | ');

      const formData = new FormData();
      formData.append('form-name',  'furniture-order');
      formData.append('client',     name);
      formData.append('contact',    contactLine);
      formData.append('order-url',  location.href);
      formData.append('item-count', String(items.length));
      formData.append('items',      summary);
      try { await fetch('/', { method: 'POST', body: formData }); }
      catch(e) { console.warn('Netlify notify failed', e); }

      document.getElementById('app').innerHTML = `
        <div class="success-screen">
          <div class="success-banner">
            <div class="success-icon">✓</div>
            <h2>Quote Submitted!</h2>
            <p>Robbie has been notified and will follow up with pricing shortly. Your quote is locked and saved. If you'd like to request additional items, use the button below — it will start a fresh quote form.</p>
            <button class="btn-back" onclick="location.reload()">＋ Request More Items</button>
          </div>
        </div>`;
    });
  }

  render();
}

/* ─── ADMIN VIEW ─────────────────────────────────────────────── */
async function renderAdmin() {

  async function showList() {
    showSpinner('Loading quotes…');
    let clients;
    try { clients = await listClients(); }
    catch(e) { showError('Could not load quotes. Check your connection.', showList); return; }

    document.getElementById('app').innerHTML = `
      <div class="page-eyebrow">Admin</div>
      <h1 class="page-title">All Quote Requests</h1>
      <p class="page-sub">Click a quote to open it, fill in pricing, and update statuses.
        Share client links: <code style="background:rgba(246,243,238,0.08);padding:2px 8px;border-radius:4px;font-size:12px;color:var(--brass-light);">hodge-ind.com/furniture/?id=firstname</code>
      </p>
      ${clients.length === 0
        ? '<div style="text-align:center;padding:60px 0;color:rgba(246,243,238,0.3);">No quotes yet.</div>'
        : `<div class="order-cards">${clients.map(c => `
            <div class="order-card" data-open="${esc(c.id)}">
              <div>
                <div class="order-card-name">${esc(c.name)}</div>
                <div class="order-card-meta">
                  ${c.itemCount} item${c.itemCount!==1?'s':''}
                  ${c.submitted ? ' · <span style="color:var(--brass-light)">Submitted</span>' : ' · Draft'}
                </div>
              </div>
              <div class="order-card-total">
                ${c.total > 0
                  ? `<div class="amt">${fmt(c.total)}</div><div class="lbl">subtotal</div>`
                  : '<div class="lbl" style="margin-top:0;">Not yet priced</div>'}
              </div>
            </div>`).join('')}</div>`}`;

    document.querySelectorAll('[data-open]').forEach(card => {
      card.addEventListener('click', () => showOrder(card.dataset.open));
    });
  }

  async function showOrder(id) {
    showSpinner('Loading quote…');
    let data;
    try { data = await loadOrder(id); }
    catch(e) { showError('Could not load this quote.', () => showOrder(id)); return; }

    let items   = data?.items?.length ? data.items : [newItem()];
    let contact = data?.contact || {};
    const name  = cap(id);

    function render() {
      const gt = orderTotal(items);
      document.getElementById('app').innerHTML = `
        <div style="margin-bottom:28px;">
          <button class="btn btn-outline" id="backBtn" style="margin-bottom:20px;">← All Quotes</button>
          <div class="page-eyebrow">Admin — Pricing</div>
          <h1 class="page-title">${esc(name)}'s Quote</h1>
          <p class="page-sub" style="margin-bottom:16px;">
            ${data?.submitted
              ? '<span style="color:var(--brass-light)">✓ Submitted — fill in pricing below and save.</span>'
              : 'Draft — client has not yet submitted.'}
          </p>
          ${(contact.name||contact.email||contact.phone) ? `
          <div style="background:rgba(246,243,238,0.04);border:1px solid var(--line-dark);border-radius:8px;padding:14px 18px;font-size:13px;color:rgba(246,243,238,0.6);display:flex;gap:24px;flex-wrap:wrap;">
            ${contact.name  ? `<span>👤 ${esc(contact.name)}</span>`  : ''}
            ${contact.email ? `<span>✉️ <a href="mailto:${esc(contact.email)}" style="color:var(--brass-light);">${esc(contact.email)}</a></span>` : ''}
            ${contact.phone ? `<span>📞 <a href="tel:${esc(contact.phone)}" style="color:var(--brass-light);">${esc(contact.phone)}</a></span>` : ''}
          </div>` : ''}
        </div>
        <div class="items-list" id="itemsList">
          ${items.map((it,i) => itemCardHTML(it, i, true)).join('')}
        </div>
        ${gt > 0 ? `
        <div class="totals-card">
          <div class="totals-row"><span>Quote Subtotal</span><span class="totals-main">${fmt(gt)}</span></div>
          <div class="totals-row"><span>50% Deposit</span><span class="totals-sub">${fmt(gt*0.5)}</span></div>
        </div>` : ''}
        <div class="actions">
          <button class="btn btn-brass" id="savePricingBtn">Save Pricing →</button>
        </div>`;

      document.getElementById('backBtn').addEventListener('click', showList);

      document.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => {
          items = collectItems().filter(it => it.id !== btn.dataset.remove);
          if (!items.length) items = [newItem()];
          render();
        });
      });

      // Admin auto-save on pricing changes
      document.getElementById('itemsList').addEventListener('input', () => {
        clearTimeout(_debounce);
        showStatus('saving', 'Saving…');
        _debounce = setTimeout(async () => {
          items = collectItems();
          await saveOrder(id, { ...data, items, contact });
          showStatus('saved', 'Saved ✓');
        }, 1500);
      });

      document.getElementById('savePricingBtn').addEventListener('click', async () => {
        items = collectItems();
        const btn = document.getElementById('savePricingBtn');
        btn.textContent = 'Saving…'; btn.disabled = true;
        showStatus('saving', 'Saving…');
        await saveOrder(id, { ...data, items, contact });
        showStatus('saved', 'Saved ✓');
        btn.textContent = 'Saved ✓';
        setTimeout(() => { btn.textContent = 'Save Pricing →'; btn.disabled = false; }, 2000);
      });
    }

    render();
  }

  showList();
}

/* ─── No-ID landing ──────────────────────────────────────────── */
function renderLanding() {
  document.getElementById('app').innerHTML = `
    <div style="max-width:480px;margin:80px auto;padding:0 24px;">
      <div class="page-eyebrow" style="justify-content:center;margin-bottom:20px;">Hodge Industries</div>
      <h1 class="page-title" style="text-align:center;margin-bottom:12px;">Furniture Quotes</h1>
      <p style="text-align:center;color:rgba(246,243,238,0.5);line-height:1.75;font-size:15px;margin-bottom:40px;">
        Enter your email to get your personal quote link. Save it — you'll use it every time you come back.
      </p>

      <div style="background:rgba(246,243,238,0.04);border:1px solid var(--line-dark);border-radius:10px;padding:32px;">
        <div class="field" style="margin-bottom:20px;">
          <label>Your Email <span class="req">*</span></label>
          <input id="landingEmail" type="email" placeholder="jane@email.com" autocomplete="email"
            style="width:100%;background:rgba(22,21,18,0.6);border:1px solid var(--line-dark);border-radius:5px;
                   color:var(--paper);font-size:16px;padding:12px 14px;outline:none;font-family:'Inter',sans-serif;
                   transition:border-color 0.2s;"
            oninput="this.style.borderColor='var(--brass)'"
          >
        </div>
        <button id="landingBtn" class="btn btn-brass" style="width:100%;padding:14px;font-size:14px;font-weight:700;cursor:pointer;border-radius:5px;">
          Get My Quote Link →
        </button>
        <p id="landingError" style="color:#e07070;font-size:13px;margin-top:12px;text-align:center;display:none;"></p>
      </div>

      <div id="landingResult" style="display:none;margin-top:24px;background:rgba(169,121,63,0.1);border:2px solid var(--brass);border-radius:10px;padding:28px;text-align:center;">
        <div style="font-size:28px;margin-bottom:12px;">✓</div>
        <p style="font-size:14px;color:rgba(246,243,238,0.6);margin-bottom:8px;">Your personal quote link:</p>
        <div id="landingUrl" style="font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--brass-light);
             word-break:break-all;margin-bottom:20px;padding:10px;background:rgba(22,21,18,0.4);border-radius:5px;"></div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
          <button id="copyBtn" class="btn btn-outline" style="font-size:13px;">Copy Link</button>
          <button id="goBtn" class="btn btn-brass" style="font-size:13px;">Open My Quote →</button>
        </div>
        <p style="font-size:12px;color:rgba(246,243,238,0.3);margin-top:16px;line-height:1.6;">
          Bookmark this link or share it with anyone helping you pick items. It's yours — come back anytime.
        </p>
        <p id="emailNote" style="display:none;font-size:13px;color:var(--brass-light);margin-top:10px;"></p>
      </div>
    </div>`;

  const emailInput = document.getElementById('landingEmail');
  const btn        = document.getElementById('landingBtn');
  const errorEl    = document.getElementById('landingError');
  const resultEl   = document.getElementById('landingResult');
  const urlEl      = document.getElementById('landingUrl');
  let generatedUrl = '';

  emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });

  btn.addEventListener('click', async () => {
    const raw = emailInput.value.trim();
    if (!raw || !raw.includes('@')) {
      errorEl.textContent = 'Please enter a valid email address.';
      errorEl.style.display = 'block';
      emailInput.style.borderColor = '#e07070';
      return;
    }
    errorEl.style.display = 'none';

    // Take everything before the @, strip non-letters, max 20 chars
    const prefix = raw.split('@')[0].toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 20);
    if (!prefix) {
      errorEl.textContent = 'Could not parse that email — please try again.';
      errorEl.style.display = 'block';
      return;
    }

    const digits     = Math.floor(1000 + Math.random() * 9000);
    const id         = prefix + digits;
    // Store email in URL so we can pre-fill it on the form
    generatedUrl = location.origin + location.pathname + '?id=' + id + '&email=' + encodeURIComponent(raw);

    urlEl.textContent = generatedUrl;
    resultEl.style.display = 'block';
    resultEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

    emailInput.disabled = true;
    btn.disabled = true;
    btn.textContent = 'Sending your link…';

    // Email them their link via Resend
    try {
      await fetch('/api/send-quote-link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: raw, quoteUrl: generatedUrl }),
      });
    } catch(e) { console.warn('Email send failed', e); }

    btn.textContent = 'Link Sent ✓';

    // Show email confirmation note
    const emailNote = document.getElementById('emailNote');
    if (emailNote) {
      emailNote.textContent = `We've also sent your link to ${raw}`;
      emailNote.style.display = 'block';
    }
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(generatedUrl).then(() => {
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.textContent = 'Copied ✓';
      setTimeout(() => { copyBtn.textContent = 'Copy Link'; }, 2000);
    }).catch(() => { prompt('Copy your link:', generatedUrl); });
  });

  document.getElementById('goBtn').addEventListener('click', () => {
    location.href = generatedUrl;
  });
}

/* ─── localStorage helpers ───────────────────────────────────── */
const LS_KEY = 'hodge_furniture_id';

function saveIdLocally(id) {
  try { localStorage.setItem(LS_KEY, id); } catch(e) {}
}
function getSavedId() {
  try { return localStorage.getItem(LS_KEY) || ''; } catch(e) { return ''; }
}

/* ─── Boot ───────────────────────────────────────────────────── */
if (IS_ADMIN) {
  renderAdmin();
} else if (CLIENT_ID) {
  saveIdLocally(CLIENT_ID); // persist this session's ID
  renderClient();
} else {
  // No ?id= in URL — check if they've been here before
  const savedId = getSavedId();
  if (savedId) {
    // Redirect straight to their form — skip the landing page
    location.replace(location.origin + location.pathname + '?id=' + savedId);
  } else {
    renderLanding();
  }
}
</script>
